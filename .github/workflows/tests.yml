name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30

    env:
      XCODE_APP: /Applications/Xcode_26.app
      DEVICE: iPhone 17 Pro

    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          echo "--- Xcodes available ---"
          ls -d /Applications/Xcode*.app
          echo "--- selected ---"
          xcodebuild -version
          echo "--- simulators available ---"
          xcrun simctl list devices available

      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"

      - name: Run tests
        run: make test DEVICE="$DEVICE"
